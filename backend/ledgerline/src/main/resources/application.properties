spring.application.name=ledgerline
server.port=${PORT:8080}

# --- App connection: use the LIMITED role (ledgerline_app) in any real deployment ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ledgerline_db}
spring.datasource.username=${DB_USER:ledgerline_user}
spring.datasource.password=${DB_PASSWORD}

# --- Migrations connect as the OWNER role (can change schema). Defaults to the app credentials. ---
spring.flyway.user=${FLYWAY_USER:${DB_USER:ledgerline_user}}
spring.flyway.password=${FLYWAY_PASSWORD:${DB_PASSWORD}}

# --- Redis (rate limiting) ---
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# --- Rate limiting switches (APP_RATELIMIT_ENABLED, APP_TRUST_PROXY) ---
# trust-proxy=true ONLY when running behind a proxy that appends the real client IP to X-Forwarded-For (e.g. Render).
app.ratelimit.enabled=true
app.trust-proxy=false
